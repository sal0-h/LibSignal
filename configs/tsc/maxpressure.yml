includes:
  - configs/tsc/base.yml


model:
  name: maxpressure
  t_min: 10
  # varaiya (default): queue-based MP aligned with Varaiya 2013 — see docs/MAXPRESSURE.md
  # libsignal: legacy lane_count[start]-lane_count[end] heuristic from upstream LibSignal
  mp_variant: varaiya
  sat_flow: 1.0


trainer:
  buffer_size: 0
  action_interval: 10
  learning_rate: 0
  learning_start: 0
  update_model_rate: 0
  update_target_rate: 0


logger:
  save_rate: 0
  train_model: False
  test_model: True
  load_model: False